<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Сравнение портативных консолей Steam Deck OLED и Nintendo Switch OLED">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Left: Steam Deck style handheld with grips -->
  <g fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M70 148 q0 -20 22 -20 h140 q20 0 20 20 v70 q0 20 -20 20 h-18 q-16 0 -20 15 l-6 22 q-5 18 -26 18 h-16 q-21 0 -25 -22 l-14 -78 q-3 -18 -11 -45 z" fill="#ffffff"/>
    <rect x="104" y="150" width="118" height="72" rx="8" fill="#0f172a" stroke="none"/>
    <circle cx="88" cy="250" r="11" fill="#e2e8f0"/>
    <path d="M78 176 v24 M66 188 h24"/>
    <circle cx="236" cy="168" r="8" fill="#38bdf8" stroke-width="4"/>
    <circle cx="236" cy="192" r="8" fill="#e2e8f0" stroke-width="4"/>
  </g>

  <!-- Right: Switch style handheld with detachable controllers -->
  <g fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="410" y="126" width="170" height="150" rx="14" fill="#ffffff"/>
    <rect x="434" y="146" width="122" height="110" rx="6" fill="#0f172a" stroke="none"/>
    <path d="M410 152 q-22 0 -22 22 v54 q0 22 22 22 z" fill="#38bdf8"/>
    <path d="M580 152 q22 0 22 22 v54 q0 22 -22 22 z" fill="#ef4444"/>
    <circle cx="399" cy="201" r="6" fill="#ffffff" stroke-width="4"/>
    <circle cx="591" cy="201" r="6" fill="#ffffff" stroke-width="4"/>
  </g>

  <!-- VS badge -->
  <circle cx="320" cy="204" r="33" fill="#2563eb"/>
  <text x="320" y="213" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="800" fill="#ffffff">VS</text>
</svg>
