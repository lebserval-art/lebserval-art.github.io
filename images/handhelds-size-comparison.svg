<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Сравнение габаритов корпусов и диагоналей экранов: Steam Deck OLED, Nintendo Switch 2 и Nintendo Switch OLED">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
  </defs>
  <rect width="760" height="360" fill="url(#bg)"/>
  <text x="380" y="34" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#1e293b">Габариты корпуса и диагональ экрана (в масштабе)</text>

  <!-- baseline -->
  <path d="M40 262 H720" stroke="#94a3b8" stroke-width="3"/>

  <!-- Steam Deck OLED: ~298 mm wide, 7.4" screen -->
  <g fill="none" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M40 120 h268 q14 0 14 16 v100 q0 16 -14 16 h-268 q-14 0 -14 -16 v-100 q0 -16 14 -16 z" fill="#ffffff"/>
    <circle cx="58" cy="186" r="14" fill="#e2e8f0"/>
    <circle cx="304" cy="164" r="9" fill="#e2e8f0"/>
    <rect x="86" y="140" width="190" height="92" rx="8" fill="#0f172a" stroke="none"/>
  </g>
  <text x="181" y="292" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1e293b">Steam Deck OLED</text>
  <text x="181" y="311" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">~298 мм · экран 7,4″ · 90 Гц</text>

  <!-- Switch 2: ~272 mm wide, ~7.9" screen -->
  <g fill="none" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="358" y="128" width="236" height="112" rx="12" fill="#ffffff"/>
    <path d="M358 150 q-16 0 -16 16 v40 q0 16 16 16 z" fill="#2563eb"/>
    <path d="M594 150 q16 0 16 16 v40 q0 16 -16 16 z" fill="#ef4444"/>
    <rect x="386" y="146" width="180" height="76" rx="6" fill="#0f172a" stroke="none"/>
  </g>
  <text x="476" y="292" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1e293b">Nintendo Switch 2</text>
  <text x="476" y="311" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">~272 мм · экран ~7,9″ · 120 Гц</text>

  <!-- Switch OLED: ~242 mm wide, 7" screen -->
  <g fill="none" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="626" y="140" width="108" height="100" rx="10" fill="#ffffff"/>
    <path d="M626 158 q-12 0 -12 12 v36 q0 12 12 12 z" fill="#38bdf8"/>
    <path d="M734 158 q12 0 12 12 v36 q0 12 -12 12 z" fill="#ef4444"/>
    <rect x="648" y="156" width="64" height="68" rx="5" fill="#0f172a" stroke="none"/>
  </g>
  <text x="680" y="292" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1e293b">Switch OLED</text>
  <text x="680" y="311" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">~242 мм · экран 7″ · 60 Гц</text>
</svg>
