<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-label="Redmi Note 14 Pro 5G — задняя панель с круглым блоком камеры на 200 Мп">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="440" fill="url(#bg)"/>
  <g stroke="#1e293b" stroke-width="5" stroke-linejoin="round">
    <!-- curved-edge body -->
    <rect x="74" y="26" width="172" height="388" rx="40" fill="#c7b8e6"/>
    <!-- circular camera island -->
    <circle cx="160" cy="104" r="58" fill="#b9a6de"/>
    <circle cx="160" cy="78" r="19" fill="#0b0b0f"/>
    <circle cx="160" cy="78" r="9" fill="#475569"/>
    <circle cx="134" cy="120" r="14" fill="#0b0b0f"/>
    <circle cx="186" cy="120" r="14" fill="#0b0b0f"/>
    <rect x="152" y="132" width="16" height="8" rx="4" fill="#fca5a5" stroke="none"/>
  </g>
  <text x="160" y="330" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#3f2d63" letter-spacing="1">Redmi</text>
  <text x="160" y="352" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#5b4a86">Note 14 Pro 5G</text>
  <text x="160" y="150" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#ffffff">200MP OIS</text>
</svg>
