<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Схема локального стриминга: игровой ПК подключён кабелем к роутеру Wi-Fi 6, клиент Moonlight на смартфоне — по 5 ГГц">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="url(#bg)"/>

  <!-- Host PC -->
  <g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <rect x="46" y="96" width="104" height="118" rx="10" fill="#ffffff"/>
    <path d="M70 122 h44 M70 142 h44"/>
    <circle cx="98" cy="178" r="18" fill="#38bdf8" stroke-width="4"/>
  </g>
  <text x="98" y="246" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">Игровой ПК</text>
  <text x="98" y="266" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Sunshine · кодирование 3–5 мс</text>

  <!-- Router -->
  <g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <rect x="326" y="140" width="150" height="74" rx="14" fill="#ffffff"/>
    <path d="M356 140 v-30 M401 140 v-40 M446 140 v-30"/>
    <circle cx="356" cy="106" r="6" fill="#e2e8f0"/>
    <circle cx="401" cy="96" r="6" fill="#e2e8f0"/>
    <circle cx="446" cy="106" r="6" fill="#e2e8f0"/>
    <circle cx="352" cy="188" r="5" fill="#22c55e" stroke-width="3"/>
    <circle cx="372" cy="188" r="5" fill="#22c55e" stroke-width="3"/>
  </g>
  <text x="401" y="248" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">Роутер Wi-Fi 6</text>
  <text x="401" y="268" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">диапазон 5 ГГц</text>

  <!-- Phone client -->
  <g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <rect x="628" y="92" width="86" height="128" rx="14" fill="#ffffff"/>
    <rect x="642" y="106" width="58" height="92" rx="5" fill="#0f172a" stroke="none"/>
    <path d="M660 132 l22 13 -22 13 z" fill="#38bdf8" stroke="none"/>
  </g>
  <text x="671" y="248" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">Moonlight</text>
  <text x="671" y="268" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">смартфон / портатив</text>

  <!-- wired link PC -> router -->
  <path d="M156 160 H320" stroke="#1e293b" stroke-width="6" stroke-linecap="round" marker-end="url(#arw)"/>
  <text x="238" y="150" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1e293b">гигабитный кабель</text>

  <!-- wireless link router -> phone -->
  <path d="M482 172 H620" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#arw)"/>
  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M506 150 q14 -14 28 0 M498 140 q22 -22 44 0"/>
  </g>
  <text x="551" y="150" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2563eb">Wi-Fi 5 ГГц</text>

  <text x="380" y="36" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#1e293b">Путь кадра: ПК → роутер → клиент</text>
</svg>
