<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Схема разводки кабелей на рабочем столе: ноутбук соединён одним кабелем Type-C с док-станцией, от которой идут монитор, Ethernet, питание, звук и периферия">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
  </defs>
  <rect width="760" height="420" fill="url(#bg)"/>

  <!-- desk line -->
  <path d="M40 330 H720" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- laptop -->
  <g fill="none" stroke="#1e293b" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="70" y="196" width="150" height="98" rx="9" fill="#ffffff"/>
    <rect x="84" y="210" width="122" height="70" rx="4" fill="#0f172a" stroke="none"/>
    <path d="M56 294 h178 l-10 16 h-158 z" fill="#e2e8f0"/>
  </g>
  <text x="145" y="344" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1e293b">Ноутбук</text>

  <!-- dock -->
  <g fill="none" stroke="#1e293b" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="330" y="250" width="120" height="44" rx="12" fill="#ffffff"/>
    <circle cx="352" cy="272" r="6" fill="#22c55e" stroke-width="4"/>
    <path d="M372 272 h10 M392 272 h10 M412 272 h10 M432 272 h10"/>
  </g>
  <text x="390" y="322" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1e293b">Док-станция</text>

  <!-- the ONE cable -->
  <path d="M222 268 q54 22 104 12" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(210,150)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#2563eb"/>
    <text x="75" y="20" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">1 кабель USB-C</text>
  </g>
  <path d="M285 180 v46" stroke="#2563eb" stroke-width="3" stroke-dasharray="3 5"/>

  <!-- monitor -->
  <g fill="none" stroke="#1e293b" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="470" y="120" width="200" height="126" rx="10" fill="#ffffff"/>
    <rect x="488" y="138" width="164" height="90" rx="5" fill="#0f172a" stroke="none"/>
    <path d="M570 246 v24 M540 270 h60"/>
  </g>
  <path d="M452 262 q40 -6 30 -30" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <text x="570" y="292" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Монитор 4K · DP Alt Mode</text>

  <!-- fan-out cables from dock -->
  <g fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round">
    <path d="M340 294 q-30 40 -70 44"/>
    <path d="M370 294 q-8 44 -20 52"/>
    <path d="M410 294 q10 44 46 50"/>
    <path d="M440 294 q34 34 92 36"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#334155">
    <text x="256" y="356" text-anchor="middle">Питание 100 Вт</text>
    <text x="346" y="366" text-anchor="middle">Ethernet</text>
    <text x="452" y="360" text-anchor="middle">Звук</text>
    <text x="556" y="348" text-anchor="middle">Клавиатура / мышь</text>
  </g>

  <text x="380" y="40" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#1e293b">Один кабель к ноутбуку — вся периферия на доке</text>
</svg>
