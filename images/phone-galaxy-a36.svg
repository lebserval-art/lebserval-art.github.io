<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-label="Samsung Galaxy A36 5G — задняя панель с тремя отдельными объективами">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="440" fill="url(#bg)"/>
  <g stroke="#1e293b" stroke-width="5" stroke-linejoin="round">
    <rect x="76" y="26" width="168" height="388" rx="30" fill="#eef1f6"/>
    <!-- connected "key island" strip -->
    <rect x="104" y="48" width="44" height="128" rx="22" fill="#e2e7ef"/>
    <circle cx="126" cy="72" r="15" fill="#0b0b0f"/><circle cx="126" cy="72" r="7" fill="#475569"/>
    <circle cx="126" cy="112" r="15" fill="#0b0b0f"/><circle cx="126" cy="112" r="7" fill="#475569"/>
    <circle cx="126" cy="152" r="15" fill="#0b0b0f"/><circle cx="126" cy="152" r="7" fill="#475569"/>
    <rect x="164" y="60" width="12" height="7" rx="3.5" fill="#fca5a5" stroke="none"/>
  </g>
  <text x="160" y="322" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#1e293b" letter-spacing="1">SAMSUNG</text>
  <text x="160" y="344" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748b">Galaxy A36 5G</text>
  <text x="160" y="398" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#2563eb">One UI · 6 лет обновлений</text>
</svg>
