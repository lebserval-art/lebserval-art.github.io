<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="ТВ-приставка (Smart TV Box) и пульт">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- TV -->
    <rect x="150" y="90" width="240" height="150" rx="12" fill="#ffffff"/>
    <rect x="170" y="110" width="200" height="110" rx="6" fill="#0f172a" stroke="none"/>
    <path d="M240 240 h60 M225 262 h90" />
    <!-- play icon on screen -->
    <path d="M255 145 l40 20 -40 20z" fill="#38bdf8" stroke="none"/>
    <!-- box -->
    <rect x="180" y="286" width="180" height="60" rx="14" fill="#ffffff"/>
    <circle cx="210" cy="316" r="9" fill="#2563eb" stroke-width="4"/>
    <circle cx="336" cy="316" r="6" fill="#22c55e" stroke-width="4"/>
  </g>
  <!-- remote -->
  <g fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="430" y="110" width="70" height="230" rx="34" fill="#ffffff"/>
    <circle cx="465" cy="160" r="20" fill="#e2e8f0"/>
    <circle cx="465" cy="160" r="7" fill="#2563eb" stroke="none"/>
    <circle cx="465" cy="212" r="7" fill="#94a3b8" stroke-width="3"/>
    <circle cx="465" cy="244" r="7" fill="#94a3b8" stroke-width="3"/>
    <path d="M452 292 h26 M452 312 h26"/>
  </g>
</svg>
