<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Умные часы, фитнес-браслет и смарт-кольцо рядом">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- watch strap -->
    <rect x="255" y="40" width="90" height="70" rx="16" fill="#ffffff"/>
    <rect x="255" y="290" width="90" height="70" rx="16" fill="#ffffff"/>
    <!-- watch case -->
    <rect x="220" y="110" width="160" height="180" rx="28" fill="#0f172a" stroke="none"/>
    <rect x="240" y="130" width="120" height="140" rx="16" fill="#0f172a"/>
    <!-- heart-rate line on screen -->
    <path d="M252 202 h20 l10 -22 14 44 12 -30 8 8 h22" stroke="#38bdf8" stroke-width="5"/>
    <circle cx="300" cy="240" r="4" fill="#22c55e" stroke="none"/>
  </g>
  <!-- fitness band -->
  <g fill="none" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="90" y="170" width="110" height="46" rx="20" fill="#ffffff"/>
    <rect x="105" y="182" width="80" height="22" rx="8" fill="#0f172a"/>
  </g>
  <!-- smart ring -->
  <g fill="none" stroke="#1e293b" stroke-width="5">
    <circle cx="500" cy="190" r="34" fill="#ffffff"/>
    <circle cx="500" cy="190" r="18" fill="none" stroke="#2563eb" stroke-width="6"/>
  </g>
</svg>
