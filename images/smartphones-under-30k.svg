<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Топ-5 смартфонов до 30 000 рублей: подиум и ценник">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- podium -->
  <g fill="none" stroke="#1e293b" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="120" y="250" width="90" height="70" rx="6" fill="#eef2ff"/>
    <rect x="210" y="212" width="90" height="108" rx="6" fill="#ffffff"/>
    <rect x="300" y="272" width="90" height="48" rx="6" fill="#eef2ff"/>
  </g>
  <g fill="#334155" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-weight="800" text-anchor="middle">
    <text x="165" y="292" font-size="26">2</text>
    <text x="255" y="270" font-size="30">1</text>
    <text x="345" y="304" font-size="22">3</text>
  </g>

  <!-- winner phone on top -->
  <g fill="none" stroke="#1e293b" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="228" y="96" width="54" height="104" rx="10" fill="#ffffff"/>
    <rect x="236" y="108" width="38" height="66" rx="3" fill="#0f172a" stroke="none"/>
    <path d="M246 186 h18"/>
    <!-- refresh-rate bars on screen -->
    <g stroke="#38bdf8" stroke-width="4">
      <path d="M243 160 v-14 M251 160 v-24 M259 160 v-34 M267 160 v-20"/>
    </g>
  </g>

  <!-- 120 Hz badge -->
  <g>
    <rect x="300" y="150" width="78" height="30" rx="15" fill="#2563eb"/>
    <text x="339" y="170" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff">120 Гц</text>
  </g>

  <!-- price tag -->
  <g fill="none" stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M430 108 l70 0 40 40 -70 70 -40 -40 z" fill="#ffffff"/>
    <circle cx="452" cy="130" r="9" fill="#38bdf8"/>
  </g>
  <text x="497" y="176" text-anchor="middle" transform="rotate(45 497 168)" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#0f172a">≤ 30 000 ₽</text>

  <!-- stars -->
  <g fill="#facc15" stroke="#eab308" stroke-width="2" stroke-linejoin="round">
    <path d="M150 120 l5 12 13 1 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -1z"/>
    <path d="M110 180 l4 9 10 1 -8 7 3 10 -9 -6 -9 6 3 -10 -8 -7 10 -1z"/>
  </g>
</svg>
