<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Подключение ноутбука к монитору и периферии через одну Type-C док-станцию">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4fe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>

  <g fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- monitor -->
    <rect x="360" y="70" width="220" height="140" rx="12" fill="#ffffff"/>
    <rect x="380" y="90" width="180" height="100" rx="5" fill="#0f172a" stroke="none"/>
    <path d="M470 210 v26 M440 236 h60"/>

    <!-- laptop -->
    <rect x="70" y="150" width="150" height="98" rx="10" fill="#ffffff"/>
    <rect x="86" y="166" width="118" height="66" rx="4" fill="#0f172a" stroke="none"/>
    <path d="M56 248 h178 l-10 14 h-158 z" fill="#e2e8f0"/>

    <!-- dock station -->
    <rect x="272" y="250" width="150" height="46" rx="12" fill="#ffffff"/>
    <circle cx="296" cy="273" r="6" fill="#22c55e" stroke-width="4"/>
    <path d="M320 273 h10 M342 273 h10 M364 273 h10 M386 273 h10" />
  </g>

  <!-- single cable laptop -> dock -->
  <path d="M212 232 q40 20 62 34" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <!-- dock -> monitor -->
  <path d="M410 250 q40 -20 60 -40" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>

  <!-- one cable badge -->
  <g transform="translate(150,300)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#2563eb"/>
    <text x="75" y="23" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff">1 кабель USB-C</text>
  </g>
</svg>
