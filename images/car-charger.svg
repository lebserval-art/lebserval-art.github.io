<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Автомобильная зарядка в прикуриватель с портами USB-C">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- cigarette lighter socket -->
    <rect x="90" y="160" width="70" height="90" rx="10" fill="#0f172a"/>
    <circle cx="125" cy="205" r="16" fill="#334155" stroke-width="4"/>
    <!-- charger body -->
    <rect x="200" y="140" width="220" height="130" rx="16" fill="#ffffff"/>
    <!-- aluminium ring detail -->
    <rect x="216" y="156" width="188" height="98" rx="10" fill="none" stroke-width="4"/>
    <!-- USB-C ports -->
    <rect x="240" y="180" width="46" height="20" rx="6" fill="#e2e8f0" stroke-width="4"/>
    <rect x="300" y="180" width="46" height="20" rx="6" fill="#e2e8f0" stroke-width="4"/>
    <rect x="240" y="216" width="106" height="20" rx="6" fill="#e2e8f0" stroke-width="4"/>
    <!-- LED indicator -->
    <circle cx="384" cy="226" r="8" fill="#22c55e" stroke-width="3"/>
  </g>
  <!-- cable to phone -->
  <path d="M420 205 q60 0 80 40" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#1e293b" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="500" y="235" width="70" height="120" rx="14" fill="#ffffff"/>
    <rect x="516" y="255" width="38" height="80" rx="4" fill="#e2e8f0" stroke-width="3"/>
  </g>
  <!-- bolt / fast charge -->
  <path d="M448 130 l14 -22 -6 22 16 -4 -20 30 6 -22 -18 4z" fill="#facc15" stroke="#eab308" stroke-width="3" stroke-linejoin="round"/>
</svg>
